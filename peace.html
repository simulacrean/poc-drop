<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Mind Blown With Peace</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee+Shade&family=VT323&family=Carlito:wght@400;700&display=swap">
<style>
/* Layout: a public-access VHS clip, full screen. A head on a cheap blue backdrop blows open into a universe of peace, then rewinds and does it again. */
:root{
  --tape:#0a0614; --chroma:#1e3cff; --skin:#f2c39b; --glow:#fff6d6; --hud:#e8ffe8; --pink:#ff7ad9;
  --display:"Bungee Shade","Impact",sans-serif; --vhs:"VT323",ui-monospace,monospace; --body:Calibri,Carlito,"Segoe UI",sans-serif;
  color-scheme:dark;
}
html,body{height:100%}
body{margin:0;background:var(--tape);color:var(--hud);font-family:var(--body);font-size:11pt;overflow:hidden}
.screen{position:relative;height:100%;overflow:hidden}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.scan{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.18) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.vign{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.track{position:absolute;left:0;right:0;height:14px;pointer-events:none;background:linear-gradient(transparent,rgba(255,255,255,.12),transparent);animation:track 6.5s linear infinite}
.hud{position:absolute;font-family:var(--vhs);font-size:clamp(18px,3vw,30px);letter-spacing:.05em;color:var(--hud);text-shadow:2px 0 rgba(255,0,80,.6),-2px 0 rgba(0,200,255,.6);pointer-events:none}
.hud.tl{left:max(16px,env(safe-area-inset-left,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.hud.tr{right:max(16px,env(safe-area-inset-right,0px));top:calc(14px + env(safe-area-inset-top,0px))}
.controls{position:absolute;display:flex;gap:8px;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.controls button{font-family:var(--vhs);font-size:20px;letter-spacing:.06em;color:var(--hud);background:rgba(0,0,0,.45);border:2px solid var(--hud);padding:4px 12px;cursor:pointer}
.controls button:hover,.controls button:focus-visible{background:var(--pink);color:#000;outline:none}
@keyframes track{0%{top:-20px}100%{top:110%}}
@media (prefers-reduced-motion:reduce){.track{animation:none;display:none}}
</style>

<div class="screen">
  <canvas id="c" role="img" aria-label="A man's head on a blue backdrop strains, then bursts open into a universe of doves, flowers, hearts and peace signs, and the word PEACE fills the screen."></canvas>
  <div class="scan"></div><div class="track"></div><div class="vign"></div>
  <div class="hud tl" id="clock">PLAY ▶ SP 0:00:00</div>
  <div class="hud tr">CH 3</div>
  <div class="controls">
    <button id="again" type="button">◀◀ AGAIN</button>
    <button id="snd" type="button" aria-pressed="false">SOUND OFF</button>
  </div>
</div>

<script>
(function(){
  var c=document.getElementById("c"), g=c.getContext("2d"), W=0, H=0, DPR=1;
  var reduce=window.matchMedia&&window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  function size(){DPR=Math.min(window.devicePixelRatio||1,2);W=c.clientWidth;H=c.clientHeight;c.width=W*DPR;c.height=H*DPR;g.setTransform(DPR,0,0,DPR,0,0);}
  window.addEventListener("resize",size); size();

  var LOOP=27, t0=performance.now(), parts=[], stars=[], boomed=false, novaed=false, frags=null, flames=[], fireSnd=false, crunchSnd=false;
  function nova(sx,sy,R){
    for(var i=0;i<160;i++){ var a=Math.random()*Math.PI*2, v=(0.4+Math.random())*R*0.16;
      parts.push({x:sx,y:sy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:["peace","heart","star","flower"][i%4],c:PAL[i%PAL.length],s:(0.2+Math.random()*0.5)*R*0.18,r:Math.random()*6,vr:(Math.random()-.5)*0.1,o:Math.random()*Math.PI*2,nova:true}); }
    if(audio.on) audio.nova();
  }
  for(var i=0;i<260;i++) stars.push({a:Math.random()*Math.PI*2,r:Math.pow(Math.random(),.6),s:Math.random()*1.8+.4,arm:i%3});
  var KINDS=["dove","dove","peace","flower","flower","heart","star","peace"];
  var PAL=["#ff7ad9","#ffd84a","#7cf0a0","#7ac8ff","#c79bff","#ffffff","#ff9a5c"];
  function boom(cx,cy,R){
    parts=[];
    for(var i=0;i<140;i++){var a=-Math.PI/2+(Math.random()-.5)*Math.PI*1.9, v=(0.25+Math.random())*R*0.09;
      parts.push({x:cx,y:cy,vx:Math.cos(a)*v,vy:Math.sin(a)*v,k:KINDS[i%KINDS.length],c:PAL[i%PAL.length],s:(0.35+Math.random()*0.9)*R*0.18,r:Math.random()*6,vr:(Math.random()-.5)*0.08,o:Math.random()*Math.PI*2});}
    if(audio.on) audio.ahh();
  }

  // --- drawing pieces ---
  function head(cx,cy,R,mood,open,shake){
    g.save(); g.translate(cx+(Math.random()-.5)*shake,cy+(Math.random()-.5)*shake);
    // neck + shirt
    g.fillStyle="#d9a77f"; g.fillRect(-R*.28,R*.75,R*.56,R*.5);
    g.fillStyle="#6a4fb3"; g.beginPath(); g.moveTo(-R*1.3,R*1.6); g.quadraticCurveTo(0,R*.95,R*1.3,R*1.6); g.lineTo(R*1.3,R*2.4); g.lineTo(-R*1.3,R*2.4); g.fill();
    // ears
    g.fillStyle="#eab48a"; g.beginPath(); g.ellipse(-R*.86,R*.05,R*.16,R*.24,0,0,7); g.ellipse(R*.86,R*.05,R*.16,R*.24,0,0,7); g.fill();

    if(open>0){ g.beginPath(); g.rect(-R*2,-R*0.2+(1-open)*-R*2,R*4,R*4); g.clip(); }
    g.fillStyle=getComputedStyle(document.documentElement).getPropertyValue("--skin")||"#f2c39b";
    g.beginPath(); g.ellipse(0,0,R*.85,R,0,0,7); g.fill();
    // hair
    if(open<=0){ g.fillStyle="#3b2a1e"; g.beginPath(); g.ellipse(0,-R*.72,R*.78,R*.34,0,Math.PI,0); g.fill(); }
    g.restore();
    // glowing rim where the top came off
    if(open>0){ var y=-R*0.2; var grd=g.createLinearGradient(0,y-R*.6,0,y);
      grd.addColorStop(0,"rgba(255,246,214,0)"); grd.addColorStop(1,"rgba(255,246,214,.9)");
      g.fillStyle=grd; g.fillRect(-R*.85,y-R*1.4,R*1.7,R*1.4);
      g.fillStyle="#ffe9b0"; g.beginPath(); g.ellipse(0,y,R*.84,R*.12,0,0,7); g.fill(); }
    // face
    g.strokeStyle="#3a2416"; g.lineWidth=Math.max(2,R*.045); g.lineCap="round";
    if(mood==="strain"){ // squeezed eyes, gritted mouth
      g.beginPath(); g.moveTo(-R*.42,R*.12); g.lineTo(-R*.18,R*.18); g.moveTo(R*.42,R*.12); g.lineTo(R*.18,R*.18); g.stroke();
      g.beginPath(); g.moveTo(-R*.5,-R*.02); g.lineTo(-R*.16,R*.06); g.moveTo(R*.5,-R*.02); g.lineTo(R*.16,R*.06); g.stroke();
      g.fillStyle="#fff"; g.fillRect(-R*.24,R*.5,R*.48,R*.14); g.strokeRect(-R*.24,R*.5,R*.48,R*.14);
      g.fillStyle="rgba(255,60,60,.35)"; g.beginPath(); g.ellipse(-R*.5,R*.38,R*.14,R*.08,0,0,7); g.ellipse(R*.5,R*.38,R*.14,R*.08,0,0,7); g.fill();
    } else if(mood==="wide"){
      g.fillStyle="#fff"; g.beginPath(); g.arc(-R*.3,R*.14,R*.17,0,7); g.arc(R*.3,R*.14,R*.17,0,7); g.fill(); g.stroke();
      g.fillStyle="#1a0f08"; g.beginPath(); g.arc(-R*.3,R*.14,R*.05,0,7); g.arc(R*.3,R*.14,R*.05,0,7); g.fill();
      g.beginPath(); g.ellipse(0,R*.58,R*.12,R*.16,0,0,7); g.fillStyle="#3a1408"; g.fill();
    } else { // serene
      g.beginPath(); g.arc(-R*.3,R*.15,R*.13,Math.PI*.15,Math.PI*.85); g.arc(R*.3,R*.15,R*.13,Math.PI*.15,Math.PI*.85); g.stroke();
      g.beginPath(); g.arc(0,R*.38,R*.28,Math.PI*.2,Math.PI*.8); g.stroke();
      g.fillStyle="rgba(255,120,170,.35)"; g.beginPath(); g.ellipse(-R*.52,R*.36,R*.13,R*.07,0,0,7); g.ellipse(R*.52,R*.36,R*.13,R*.07,0,0,7); g.fill();
    }
    g.restore();
  }
  // A cartoon skeleton posed from joint positions (units, y up from the mat), blended between yoga poses.
  var POSE={
    mountain:{head:[0,-6.6],chest:[0,-5.3],pelvis:[0,-3.4],lE:[-.5,-6.6],lH:[-.1,-7.6],rE:[.5,-6.6],rH:[.1,-7.6],lK:[-.35,-1.7],lF:[-.35,0],rK:[.35,-1.7],rF:[.35,0]},
    tree:{head:[0,-6.6],chest:[0,-5.3],pelvis:[0,-3.4],lE:[-.85,-4.6],lH:[-.05,-4.9],rE:[.85,-4.6],rH:[.05,-4.9],lK:[-.25,-1.7],lF:[-.25,0],rK:[1.4,-2.6],rF:[-.1,-2.1]},
    warrior:{head:[0,-6.0],chest:[0,-4.8],pelvis:[0,-2.9],lE:[-1.4,-4.8],lH:[-2.7,-4.8],rE:[1.4,-4.8],rH:[2.7,-4.8],lK:[-1.5,-1.6],lF:[-1.7,0],rK:[1.1,-1.5],rF:[2.1,0]},
    dog:{head:[-1.8,-1.4],chest:[-1.0,-2.4],pelvis:[.4,-3.6],lE:[-1.9,-1.2],lH:[-2.6,0],rE:[-1.7,-1.1],rH:[-2.4,0],lK:[1.1,-1.8],lF:[1.7,0],rK:[1.3,-1.8],rF:[1.9,0]}
  };
  function skeleton(x0,y0,u,from,to,f,glow,T){
    var A=POSE[from],B=POSE[to],P={}; for(var k in A) P[k]=[(A[k][0]+(B[k][0]-A[k][0])*f)*u+x0,(A[k][1]+(B[k][1]-A[k][1])*f)*u+y0+Math.sin(T*2)*u*.03];
    var sh=[[P.chest[0]-u*.55,P.chest[1]],[P.chest[0]+u*.55,P.chest[1]]], hp=[[P.pelvis[0]-u*.35,P.pelvis[1]],[P.pelvis[0]+u*.35,P.pelvis[1]]];
    g.save(); g.lineCap="round"; g.lineJoin="round";
    if(glow>0){ g.shadowColor="rgba(160,220,255,"+glow+")"; g.shadowBlur=u*1.5; }
    function bone(a,b,w){ g.strokeStyle="#3a2f4a"; g.lineWidth=w+u*.12; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
      g.strokeStyle="#fbf6ea"; g.lineWidth=w; g.beginPath(); g.moveTo(a[0],a[1]); g.lineTo(b[0],b[1]); g.stroke();
      [a,b].forEach(function(p){ g.fillStyle="#fbf6ea"; g.beginPath(); g.arc(p[0],p[1],w*.75,0,7); g.fill(); }); }
    var w=u*.22;
    // spine and ribs
    bone(P.chest,P.pelvis,w*.8);
    for(var r=0;r<4;r++){ var q=.18+r*.2, mx=P.chest[0]+(P.pelvis[0]-P.chest[0])*q*.6, my=P.chest[1]+(P.pelvis[1]-P.chest[1])*q*.6, dx=P.pelvis[0]-P.chest[0], dy=P.pelvis[1]-P.chest[1], L=Math.hypot(dx,dy)||1, nx=-dy/L, ny=dx/L, rl=u*(.75-r*.1);
      bone([mx-nx*rl,my-ny*rl],[mx+nx*rl,my+ny*rl],w*.55); }
    bone(sh[0],sh[1],w*.7); bone(hp[0],hp[1],w);
    // limbs
    bone(sh[0],P.lE,w); bone(P.lE,P.lH,w*.85); bone(sh[1],P.rE,w); bone(P.rE,P.rH,w*.85);
    bone(hp[0],P.lK,w*1.1); bone(P.lK,P.lF,w); bone(hp[1],P.rK,w*1.1); bone(P.rK,P.rF,w);
    bone(P.chest,P.head,w*.6);
    // skull, eyes closed in bliss
    var hx=P.head[0], hy=P.head[1], s=u*.75;
    g.fillStyle="#3a2f4a"; g.beginPath(); g.arc(hx,hy,s+u*.07,0,7); g.fill();
    g.fillStyle="#fbf6ea"; g.beginPath(); g.arc(hx,hy,s,0,7); g.fill(); g.fillRect(hx-s*.5,hy+s*.5,s,s*.45);
    g.shadowBlur=0; g.strokeStyle="#3a2f4a"; g.lineWidth=u*.09;
    g.beginPath(); g.arc(hx-s*.38,hy-s*.02,s*.22,Math.PI*.1,Math.PI*.9); g.stroke();
    g.beginPath(); g.arc(hx+s*.38,hy-s*.02,s*.22,Math.PI*.1,Math.PI*.9); g.stroke();
    g.fillStyle="#3a2f4a"; g.beginPath(); g.moveTo(hx,hy+s*.22); g.lineTo(hx-s*.1,hy+s*.42); g.lineTo(hx+s*.1,hy+s*.42); g.fill();
    for(var tt=-2;tt<=2;tt++) g.fillRect(hx+tt*s*.18-s*.02,hy+s*.6,s*.04,s*.3);
    g.restore();
  }
  // The bones crumble into fragments that tumble, then gather into a heart, which catches fire.
  function heartPt(th){ return [16*Math.pow(Math.sin(th),3), -(13*Math.cos(th)-5*Math.cos(2*th)-2*Math.cos(3*th)-Math.cos(4*th))]; }
  function makeFrags(x0,y0,u){
    var A=POSE.mountain, P={}; for(var k in A) P[k]=[A[k][0]*u+x0,A[k][1]*u+y0];
    var sh=[[P.chest[0]-u*.55,P.chest[1]],[P.chest[0]+u*.55,P.chest[1]]], hp=[[P.pelvis[0]-u*.35,P.pelvis[1]],[P.pelvis[0]+u*.35,P.pelvis[1]]];
    var segs=[[P.chest,P.pelvis],[sh[0],sh[1]],[hp[0],hp[1]],[sh[0],P.lE],[P.lE,P.lH],[sh[1],P.rE],[P.rE,P.rH],[hp[0],P.lK],[P.lK,P.lF],[hp[1],P.rK],[P.rK,P.rF],[P.chest,P.head]];
    var out=[], hc=[x0,y0-u*5.2], hs=u*0.3;
    for(var i=0;i<380;i++){ var sgm=segs[i%segs.length], q=Math.random(), sx=sgm[0][0]+(sgm[1][0]-sgm[0][0])*q, sy=sgm[0][1]+(sgm[1][1]-sgm[0][1])*q;
      if(i%13===0){ var a=Math.random()*7; sx=P.head[0]+Math.cos(a)*u*.6; sy=P.head[1]+Math.sin(a)*u*.6; }
      var th=Math.random()*Math.PI*2, k2=Math.sqrt(Math.random()), hpnt=heartPt(th);
      out.push({x:sx,y:sy,sx:sx,sy:sy,vx:(Math.random()-.5)*u*.08,vy:-Math.random()*u*.05,tx:hc[0]+hpnt[0]*hs*k2,ty:hc[1]+hpnt[1]*hs*k2,s:u*(.08+Math.random()*.14),r:Math.random()*6,d:Math.random()*.5}); }
    return out;
  }
  function crumble(x0,y0,u,t,T){
    if(!frags){ frags=makeFrags(x0,y0,u); if(audio.on) audio.crumble(); }
    var ct=t-14.4, fire=Math.max(0,Math.min(1,(t-15.4)/.6));
    g.save();
    // a solid heart forms under the fragments as they arrive, then beats
    var form=Math.max(0,Math.min(1,(ct-1.3)/0.8));
    if(form>0){ var hc0=[x0,y0-u*5.2], beat=1+Math.max(0,Math.sin(T*7))*0.06*fire;
      g.save(); g.translate(hc0[0],hc0[1]); g.scale(u*0.3*beat,u*0.3*beat);
      g.beginPath(); for(var a=0;a<=Math.PI*2+0.01;a+=0.05){ var hp2=heartPt(a); if(a===0) g.moveTo(hp2[0],hp2[1]); else g.lineTo(hp2[0],hp2[1]); } g.closePath();
      var hg=g.createLinearGradient(0,-12,0,17); hg.addColorStop(0,fire>0?"#ff5a3c":"#ff7aa8"); hg.addColorStop(1,fire>0?"#b3001e":"#e0306a");
      g.globalAlpha=form; g.fillStyle=hg; g.fill();
      g.lineWidth=1.2; g.strokeStyle=fire>0?"#ffd27a":"#ffffff"; g.shadowColor=fire>0?"#ff8a00":"#ffffff"; g.shadowBlur=u*1.2; g.stroke();
      g.restore(); }
    for(var i=0;i<frags.length;i++){ var p=frags[i];
      if(ct<0.6){ p.vy+=u*.012; p.x+=p.vx; p.y+=p.vy; if(p.y>y0){ p.y=y0; p.vy*=-0.3; } p.r+=0.1; p.fx=p.x; p.fy=p.y; }
      else { var k=Math.max(0,Math.min(1,(ct-0.6-p.d)/0.9)); k=k*k*(3-2*k);
        p.x=p.fx+(p.tx-p.fx)*k+(k<1?Math.sin(k*Math.PI)*u*.8*Math.cos(p.r):0); p.y=p.fy+(p.ty-p.fy)*k-(k<1?Math.sin(k*Math.PI)*u*1.2:0); }
      var col=fire>0?"hsl("+(40-fire*30+Math.sin(T*9+i)*8)+",100%,"+(85-fire*30)+"%)":"#fbf6ea";
      g.fillStyle=col; g.save(); g.translate(p.x,p.y); g.rotate(p.r); g.fillRect(-p.s/2,-p.s/3,p.s,p.s*.66); g.restore(); }
    if(fire>0){
      if(!fireSnd){ fireSnd=true; if(audio.on) audio.fire(); }
      // glow behind the heart, then flames licking up from it
      var hc=[x0,y0-u*5.2], gl=g.createRadialGradient(hc[0],hc[1],0,hc[0],hc[1],u*8);
      gl.addColorStop(0,"rgba(255,140,40,"+(.45*fire)+")"); gl.addColorStop(1,"rgba(255,80,20,0)"); g.fillStyle=gl; g.fillRect(hc[0]-u*8,hc[1]-u*8,u*16,u*16);
      for(var n=0;n<6;n++){ var src=frags[Math.floor(Math.random()*frags.length)]; flames.push({x:src.x+(Math.random()-.5)*u*.3,y:src.y,vy:-(u*.04+Math.random()*u*.06),vx:(Math.random()-.5)*u*.02,life:1,s:u*(.25+Math.random()*.35)}); }
      g.globalCompositeOperation="lighter";
      for(var j=flames.length-1;j>=0;j--){ var fl=flames[j]; fl.x+=fl.vx+Math.sin(T*12+j)*u*.01; fl.y+=fl.vy; fl.life-=0.025; if(fl.life<=0){ flames.splice(j,1); continue; }
        var hue=fl.life>0.7?50:fl.life>0.4?28:8, rad=fl.s*(0.4+fl.life);
        var fg=g.createRadialGradient(fl.x,fl.y,0,fl.x,fl.y,rad); fg.addColorStop(0,"hsla("+hue+",100%,60%,"+(fl.life*.55*fire)+")"); fg.addColorStop(1,"hsla("+hue+",100%,50%,0)");
        g.fillStyle=fg; g.beginPath(); g.arc(fl.x,fl.y,rad,0,7); g.fill(); }
    }
    g.restore();
  }
  function peace(s){ g.lineWidth=s*.16; g.beginPath(); g.arc(0,0,s,0,7); g.moveTo(0,-s); g.lineTo(0,s); g.moveTo(0,0); g.lineTo(-s*.7,s*.7); g.moveTo(0,0); g.lineTo(s*.7,s*.7); g.stroke(); }
  function flower(s,col){ g.fillStyle=col; for(var i=0;i<6;i++){g.save();g.rotate(i*Math.PI/3);g.beginPath();g.ellipse(0,-s*.55,s*.28,s*.5,0,0,7);g.fill();g.restore();} g.fillStyle="#ffd84a"; g.beginPath(); g.arc(0,0,s*.3,0,7); g.fill(); }
  function heart(s,col){ g.fillStyle=col; g.beginPath(); g.moveTo(0,s*.35); g.bezierCurveTo(-s*1.1,-s*.35,-s*.45,-s*1.05,0,-s*.45); g.bezierCurveTo(s*.45,-s*1.05,s*1.1,-s*.35,0,s*.35); g.fill(); }
  function star(s,col){ g.fillStyle=col; g.beginPath(); for(var i=0;i<10;i++){var r=i%2?s*.42:s; var a=i*Math.PI/5-Math.PI/2; g.lineTo(Math.cos(a)*r,Math.sin(a)*r);} g.fill(); }
  function dove(s,flap){ g.fillStyle="#ffffff"; g.beginPath(); g.ellipse(0,0,s*.9,s*.38,0,0,7); g.fill();
    g.beginPath(); g.arc(s*.75,-s*.22,s*.26,0,7); g.fill();
    g.fillStyle="#ffb347"; g.beginPath(); g.moveTo(s*1,-s*.24); g.lineTo(s*1.3,-s*.16); g.lineTo(s*1,-s*.1); g.fill();
    g.fillStyle="#ffffff"; g.beginPath(); g.moveTo(-s*.2,-s*.1); g.lineTo(s*.25,-s*.1); g.lineTo(-s*.4,-s*(0.6+0.7*Math.abs(Math.sin(flap)))); g.fill();
    g.beginPath(); g.moveTo(-s*.85,0); g.lineTo(-s*1.35,-s*.25); g.lineTo(-s*1.3,s*.2); g.fill();
